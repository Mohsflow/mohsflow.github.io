<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>¡Hola! 👋</h1>

    <p>Esta es mi primera página web.</p>

    <button onclick="saludar()">Haz clic</button>

    <script>
        function saludar() {
            alert("¡Gracias por visitar mi web!");
        }
    </script>

</body>
</html>
